# /run/waypoint holds the provisioning socket. The directory is 0750 root:waypoint
# so that a process outside the group cannot even stat the socket, which is a
# second lock behind the socket's own 0660 mode and the helper's SO_PEERCRED check.
#
# systemd would create this implicitly for ListenStream=, but with 0755 — and a
# world-traversable directory is exactly what the group ownership below is for.
d /run/waypoint 0750 root waypoint -
