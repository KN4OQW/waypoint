<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="settings.pageTitle">Waypoint · Settings</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script>
  /* Apply saved theme + mode before first paint (RFC-0009); dark is the default. */
  (function () {
    try {
      var m = localStorage.getItem("wp-mode");
      if (m === null && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) m = "light";
      if (m === "light") document.documentElement.setAttribute("data-mode", "light");
      var t = localStorage.getItem("wp-theme");
      if (t && t !== "phosphor") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage blocked — dark default */ }
  })();
</script>
<style>
  /* Waypoint settings — "Nocturne" phosphor theme, adapted from the Claude
     Design mockup. Self-contained and offline-safe: no external font/CDN, since
     a hotspot may have no internet. Fonts fall back through the stack. */
  :root {
    --accent: #35d07f; --accent-soft: rgba(53,208,127,0.13); --accent-glow: rgba(53,208,127,0.4);
    --bg: #06070a; --panel: #0f1218; --panel-line: #1c222c; --field: #0a0d12; --field-line: #262c38;
    --side: #0b0d12; --side-line: #14181f; --row-line: #171b23;
    /* --dim/--faint raised to meet WCAG AA (4.5:1) as small de-emphasised text
       on the darkest panels; the old #5a6472/#4a5361 sat at ~3:1 and failed. */
    --ink: #e4ebf4; --ink-head: #eef2f7; --ink-body: #c7cfdb; --label: #8a94a6; --muted: #7f8a99; --dim: #828c9b; --faint: #767f8c;
    --bad: #ff6b6b; --warn: #ff9f45;
    /* Semantic surfaces (RFC-0009): named so light mode can re-map every surface. */
    --chip-bg: #0c0f15; --chip-line: #1a1f28; --tag-bg: #0c0f15; --card-t: #aeb7c4;
    --stat-k: #525c6a; --stat-v: #dfe6f0; --led-off: #252b34;
    --swatch-bg: #0b0e13; --swatch-on: #12161d;
    --scroll-track: #0a0c10; --scroll-thumb: #232a35;
    --statusbar-bg: rgba(9,11,15,.72);
    --input-bg: #0a0d12; --input-line: #2a3140; --input-ink: #e4ebf4;
    --pill-bg: #181d26; --pill-line: #2a3140;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  :root[data-theme="amber"] { --accent: #f0a935; --accent-soft: rgba(240,169,53,0.13); --accent-glow: rgba(240,169,53,0.45); }
  :root[data-theme="ice"]   { --accent: #4db8ff; --accent-soft: rgba(77,184,255,0.13); --accent-glow: rgba(77,184,255,0.45); }
  /* Light mode (RFC-0009): dark is default; data-mode="light" re-maps every surface
     and darkens the accent to clear 4.5:1 on white. Composes with the accent themes. */
  :root[data-mode="light"] {
    --accent: #12a35a; --accent-soft: rgba(18,163,90,0.12); --accent-glow: rgba(18,163,90,0.30);
    --bg: #eef1f6; --panel: #ffffff; --panel-line: #dde3ec; --field: #f5f7fb; --field-line: #ccd4e0;
    --side: #f3f5f9; --side-line: #dde3ec; --row-line: #e7ebf2;
    --ink: #1a2130; --ink-head: #0e1420; --ink-body: #333b49; --label: #566072; --muted: #5c6472; --dim: #616a78; --faint: #6b7380;
    --bad: #cc3333; --warn: #9a5f08;
    --chip-bg: #f0f3f8; --chip-line: #dde3ec; --tag-bg: #f0f3f8; --card-t: #566072;
    --stat-k: #6b7380; --stat-v: #1a2130; --led-off: #c2cad6;
    --swatch-bg: #eef1f6; --swatch-on: #ffffff;
    --scroll-track: #e7ebf2; --scroll-thumb: #c2cad6;
    --statusbar-bg: rgba(255,255,255,0.82);
    --input-bg: #ffffff; --input-line: #ccd4e0; --input-ink: #1a2130;
    --pill-bg: #eef1f6; --pill-line: #ccd4e0;
  }
  :root[data-mode="light"][data-theme="amber"] { --accent: #9a5d05; --accent-soft: rgba(154,93,5,0.12); --accent-glow: rgba(154,93,5,0.30); }
  :root[data-mode="light"][data-theme="ice"]   { --accent: #1f77c9; --accent-soft: rgba(31,119,201,0.12); --accent-glow: rgba(31,119,201,0.30); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse 90% 60% at 78% -10%, var(--accent-soft), transparent 55%), var(--bg);
    color: var(--ink-body); font-family: var(--sans); min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Links sitting inside body text are underlined so they're distinguishable
     without relying on colour (WCAG 1.4.1). */
  .note a, .pagehead p a { text-decoration: underline; }
  ::selection { background: var(--accent-soft); }
  input, select, textarea { font-family: var(--mono); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; border: 2px solid var(--scroll-track); }
  @keyframes wpblink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .app { min-height: 100vh; display: grid; grid-template-columns: 264px 1fr; }

  /* sidebar */
  aside { border-right: 1px solid var(--side-line); background: var(--side); display: flex; flex-direction: column; min-height: 100vh; }
  .brand { padding: 22px 22px 20px; border-bottom: 1px solid var(--side-line); }
  .brand-row { display: flex; align-items: center; gap: 11px; }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: 2.5px; color: var(--ink-head); }
  .brand-sub { font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--dim); margin-top: 1px; }
  .callsign-chip { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; background: var(--chip-bg); border: 1px solid var(--chip-line); border-radius: 7px; padding: 8px 11px; }
  .chip-k { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; color: var(--dim); }
  .chip-v { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 1px; }
  .online { display: flex; align-items: center; gap: 6px; }
  .online .led { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); animation: wpblink 2.4s ease-in-out infinite; }
  .online .txt { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--muted); }

  nav { padding: 14px 12px; flex: 1; }
  .nav-head { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--faint); padding: 0 10px 10px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px; margin: 2px 0; border-radius: 8px; cursor: pointer; position: relative; background: transparent; border: 0; width: 100%; text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,0.02); }
  .nav-item .bar { position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
  .nav-item .tag { flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 7px; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .5px; border: 1px solid var(--field-line); color: var(--muted); background: var(--tag-bg); }
  .nav-item .label { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink-body); letter-spacing: .2px; }
  .nav-item .sub { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .5px; color: var(--dim); margin-top: 1px; }
  .nav-item.on { background: var(--accent-soft); }
  .nav-item.on .bar { background: var(--accent); }
  .nav-item.on .tag { border-color: var(--accent); color: var(--accent); background: rgba(0,0,0,.25); }
  .nav-item.on .label { color: var(--ink-head); font-weight: 600; }

  /* Grouped sidebar (D2). Each group header is a disclosure button over its item
     list; a collapsed list is `hidden`, so it leaves the tab order as well as the
     view. The item styling above is unchanged — only the nesting is new. */
  .nav-group + .nav-group { margin-top: 6px; }
  .nav-group-h { margin: 0; font-weight: 400; }
  /* --muted, not the --faint the static .nav-head uses: at 9.5px this is small text
     needing 4.5:1, and --faint only reaches 4.38:1 on the light-mode sidebar. */
  .nav-group-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 7px; cursor: pointer;
    background: transparent; border: 0; text-align: left; font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--muted); }
  .nav-group-btn:hover { background: rgba(255,255,255,0.02); color: var(--ink-body); }
  .nav-group-btn .chev { flex: none; width: 0; height: 0; border-left: 4px solid currentColor;
    border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; transition: transform .12s ease; }
  .nav-group-btn.open .chev { transform: rotate(90deg); }
  .nav-group-btn .gname { flex: 1; }
  .nav-group-btn .gcount { flex: none; letter-spacing: 1px; color: var(--dim); }
  .nav-group-items[hidden] { display: none; }

  .theme-pick { padding: 14px 18px 18px; border-top: 1px solid var(--side-line); }
  .theme-head { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--faint); margin-bottom: 9px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; } /* the full-width mode toggle wraps to its own row above the accent dots */
  .swatch { flex: 1; display: flex; align-items: center; justify-content: center; padding: 9px 0; border-radius: 7px; cursor: pointer; background: var(--swatch-bg); border: 1px solid var(--chip-line); }
  .swatch .dot { width: 12px; height: 12px; border-radius: 50%; }
  .swatch.on { background: var(--swatch-on); }
  .swatch.mode-toggle { flex: 1 1 100%; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--ink-body); margin-bottom: 7px; padding: 8px 0; }
  .swatch.mode-toggle.light { color: var(--accent); }
  /* Language picker, below the swatches — same control as the dashboard. */
  .lang-pick { margin-top: 13px; }
  .lang-select { width: 100%; padding: 8px 9px; border-radius: 7px; cursor: pointer;
    background: var(--swatch-bg); border: 1px solid var(--chip-line); color: var(--ink-body);
    font-family: var(--mono); font-size: 11px; }

  /* main */
  main { min-width: 0; display: flex; flex-direction: column; max-height: 100vh; overflow: hidden; }
  .statusbar { border-bottom: 1px solid var(--side-line); background: var(--statusbar-bg); backdrop-filter: blur(6px); padding: 13px 30px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .k { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; color: var(--stat-k); }
  .stat .v { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--stat-v); }
  .stat .v.accent { color: var(--accent); }
  /* The eight mode LEDs are ~382px laid out in a row; wrapping keeps them inside a
     320px phone instead of pushing the page into a sideways scroll (RFC-0009). */
  .leds { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
  .led-mode { display: flex; align-items: center; gap: 5px; }
  .led-mode .d { width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); }
  .led-mode.on .d { background: var(--accent); box-shadow: 0 0 7px var(--accent-glow); }
  .led-mode .a { font-family: var(--mono); font-size: 9.5px; letter-spacing: .5px; color: #454e5c; }
  .led-mode.on .a { color: #cfd6e0; }

  .scroll { flex: 1; overflow-y: auto; padding: 30px 34px 60px; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
  .crumb { font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px; color: var(--accent); margin-bottom: 7px; }
  .pagehead h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -.3px; color: var(--ink-head); }
  .pagehead p { margin: 7px 0 0; font-size: 13.5px; color: var(--muted); max-width: 560px; line-height: 1.5; }
  .actions { display: flex; gap: 10px; flex: none; align-items: center; }
  .btn { font-family: var(--mono); font-size: 12px; letter-spacing: .5px; border-radius: 7px; padding: 10px 16px; cursor: pointer; }
  .btn.ghost { color: var(--ink-body); background: var(--input-bg); border: 1px solid var(--input-line); }
  .btn.primary { font-weight: 600; color: var(--bg); background: var(--accent); border: 1px solid var(--accent); box-shadow: 0 0 16px var(--accent-soft); padding: 10px 18px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .ro-badge { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--warn); border: 1px solid rgba(255,159,69,.35); border-radius: 4px; padding: 5px 9px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  /* Responsive (RFC-0009): tablet collapses the sidebar to a top bar; phone tightens
     padding/type and keeps touch targets >= 44px. The page body never scrolls
     sideways.

     The tab rail used to be a horizontal scroll strip, which was already at its
     usability limit at ~18 tabs. It is now a wrapping grid of touch tiles sectioned
     by nav group (D3): picking a tile swaps the grid for that panel plus a back
     control, so a narrow viewport shows one of the two, never both stacked. */
  @media (max-width: 1023px) {
    .app { grid-template-columns: 1fr; }
    /* min-width:0 lets the grid item shrink to the column, so the tile grid tracks
       the viewport instead of stretching the page (RFC-0009). */
    aside { min-height: auto; min-width: 0; border-right: 0; border-bottom: 1px solid var(--side-line); }
    main { max-height: none; overflow: visible; }
    .grid2 { grid-template-columns: 1fr; }
    nav { padding: 12px 14px 16px; }
    .nav-head { display: none; }
    .theme-pick { border-top: 0; }

    .tile-sec { margin: 14px 2px 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 2px; color: var(--muted); font-weight: 400; }
    .tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 8px; }
    .nav-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; min-height: 76px;
      padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left;
      background: var(--chip-bg); border: 1px solid var(--chip-line); }
    .nav-tile .tag { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .5px; color: var(--muted);
      background: var(--tag-bg); border: 1px solid var(--field-line); border-radius: 5px; padding: 1px 5px; }
    .nav-tile .label { font-size: 13.5px; font-weight: 500; color: var(--ink-body); margin-top: 3px; }
    .nav-tile .sub { font-family: var(--mono); font-size: 9px; letter-spacing: .5px; color: var(--label); }
    .nav-tile.on { background: var(--accent-soft); border-color: var(--accent); }
    /* The selected tile is marked by its accent border, tint and bolder label rather
       than by accent-on-tint text: the light-mode accent only reaches 2.6:1 against
       its own soft tint, well under the 4.5:1 this 10px tag needs. */
    .nav-tile.on .tag { color: var(--ink-head); border-color: var(--accent); }
    .nav-tile.on .label { color: var(--ink-head); font-weight: 600; }

    .nav-back { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 8px;
      cursor: pointer; background: var(--chip-bg); border: 1px solid var(--chip-line);
      color: var(--ink-body); font-family: var(--mono); font-size: 12px; letter-spacing: 1px; }
    .nav-back .chev { color: var(--accent); font-size: 14px; }
    /* The two narrow-viewport views. Anything hidden here is display:none, so it is
       out of the tab order and out of an assistive tree walk too. */
    :root[data-nav-view="grid"] .nav-back { display: none; }
    :root[data-nav-view="grid"] #panels { display: none; }
    :root[data-nav-view="panel"] .nav-grid { display: none; }
  }
  @media (max-width: 640px) {
    .brand, .theme-pick { padding-left: 14px; padding-right: 14px; }
    .statusbar { padding: 10px 14px; gap: 12px 18px; }
    .scroll, .content { padding-left: 14px !important; padding-right: 14px !important; }
    .pagehead { flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .pagehead h1 { font-size: 21px; }
    .actions { width: 100%; } /* buttons wrap to their own full-width row on a phone */
    .card { padding-left: 14px; padding-right: 14px; }
    .row { flex-wrap: wrap; }
    .row label { min-width: 0; }
    .row input, .row select, .tz-combo .tz-input { min-height: 44px; }
    .tz-list .tz-opt { min-height: 40px; display: flex; align-items: center; } /* comfortable tap target on a phone */
    .pill, .btn, .mode-card, button.pill { min-height: 40px; }
    .swatch { min-height: 44px; }
    .lang-select { min-height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 11px; padding: 6px 22px 18px; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 16px 0 6px; }
  .card-head .sq { width: 6px; height: 6px; background: var(--accent); border-radius: 1px; }
  .card-head .t { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--card-t); }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--row-line); }
  .row label { font-size: 12.5px; color: var(--label); }

  /* Inline help (#135). The trigger sits in the label; the body spans the whole row
     underneath so it has the full card width to read across. The body is .sr-only
     when collapsed rather than display:none — aria-describedby cannot reach hidden
     content, so a screen reader gets the description regardless of whether a
     sighted operator has opened it. */
  .help-btn { margin-left: 6px; width: 22px; height: 22px; padding: 0; border-radius: 50%; cursor: pointer; vertical-align: middle;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; line-height: 1; font-weight: 600;
    color: var(--muted); background: var(--chip-bg); border: 1px solid var(--field-line); }
  .help-btn:hover { color: var(--ink-head); border-color: var(--accent); }
  /* Open state is carried by the accent border and tint plus aria-expanded, not by
     accent-coloured glyph: the light-mode accent is only 2.87:1 on its own tint,
     well under the 4.5:1 an 11px character needs. */
  .help-btn[aria-expanded="true"] { color: var(--ink-head); border-color: var(--accent); background: var(--accent-soft); }
  .row-help { grid-column: 1 / -1; margin: 9px 0 2px; padding: 10px 12px; border-radius: 8px;
    background: var(--chip-bg); border: 1px solid var(--chip-line); border-left: 2px solid var(--accent);
    font-size: 12.5px; line-height: 1.55; color: var(--ink-body); }
  .row-help b { color: var(--ink-head); }
  /* Not the accent used by .note code: at 2.95:1 on the light-mode help surface it
     fails, and these are INI keys and device paths worth reading exactly. */
  .row-help code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-head); background: var(--field); border: 1px solid var(--field-line); padding: 0 4px; border-radius: 3px; }
  /* .toggle-row is flex, not grid — let the body wrap onto its own full-width line. */
  .toggle-row.has-help { flex-wrap: wrap; }
  .toggle-row .row-help { flex: 1 0 100%; }
  /* An .sr-only body must not keep its box styling, or it would still reserve space. */
  .row-help.sr-only { padding: 0; margin: 0; border: 0; }
  .row input, .row select { background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 9px 11px; color: var(--ink); font-size: 13px; width: 100%; }
  .row input[readonly], .row select[disabled] { opacity: .85; }
  .row .accent { color: var(--accent); }
  .unit { display: flex; align-items: center; gap: 8px; }
  .unit .u { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  /* Timezone combobox (tzpicker.js, #139). The input matches .row input; the
     listbox floats over the card so the filtered zones don't push the layout. */
  .tz-combo { position: relative; width: 100%; }
  .tz-combo .tz-input { width: 100%; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 9px 11px; color: var(--ink); font-family: var(--mono); font-size: 13px; }
  .tz-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
    max-height: 240px; overflow-y: auto; background: var(--panel); border: 1px solid var(--field-line); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45); }
  .tz-list .tz-opt { padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-body); cursor: pointer; }
  .tz-list .tz-opt:hover { background: var(--field); }
  /* The active (arrow-key) option is carried by tint AND a left accent bar, not
     colour alone, so it reads in high-contrast and light modes (WCAG 1.4.1). */
  .tz-list .tz-opt.active { background: var(--accent-soft); color: var(--ink-head); box-shadow: inset 2px 0 0 var(--accent); }
  .tz-list .tz-empty { padding: 8px 10px; font-size: 12px; color: var(--muted); }
  /* D3 "Detected from your browser" label and the D4 "use it?" hint. */
  .tz-detected { display: inline-block; margin-top: 6px; font-size: 11.5px; color: var(--accent); }
  .tz-hint { grid-column: 1 / -1; margin: 8px 0 2px; padding: 9px 12px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    background: var(--chip-bg); border: 1px solid var(--chip-line); border-left: 2px solid var(--accent); font-size: 12.5px; color: var(--ink-body); }
  .tz-hint code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-head); background: var(--field); border: 1px solid var(--field-line); padding: 0 4px; border-radius: 3px; }
  .tz-hint .tz-hint-actions { margin-left: auto; display: flex; gap: 8px; }
  .tz-hint button { font-family: var(--mono); font-size: 12px; cursor: pointer; border-radius: 6px; padding: 5px 12px; }
  .tz-hint .tz-hint-use { background: var(--accent); color: #000; border: none; }
  .tz-hint .tz-hint-dismiss { background: transparent; color: var(--muted); border: 1px solid var(--field-line); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--swatch-bg); border: 1px solid var(--chip-line); border-radius: 8px; padding: 11px 14px; margin-top: 10px; }
  .toggle-row .name { font-size: 12.5px; color: var(--ink-body); }
  /* A toggle may carry one line of context under its label — used where the
     consequence of flipping it is not obvious from the label alone, which on the
     Public View tab is most of them. Block, or it runs into the label. */
  .toggle-row .name .sub { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; max-width: 52ch; }
  /* The Public View tab's own bits: a chip row for the purpose tags, and a
     preview box for the server-rendered narrative. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .pv-preview {
    margin-top: 8px; padding: 10px 12px; background: var(--field);
    border: 1px solid var(--field-line); border-radius: 8px; font-size: 13px; line-height: 1.55;
  }
  .pv-preview :first-child { margin-top: 0; }
  .pv-preview :last-child { margin-bottom: 0; }
  .pill { font-family: var(--mono); font-size: 10px; border-radius: 4px; padding: 3px 8px; }
  .pill.on { color: var(--accent); border: 1px solid var(--accent); }
  .pill.off { color: var(--dim); border: 1px solid var(--pill-line); }

  /* Mode buses (RFC-0003). The bus card reuses .card/.card-head; these add the
     per-bus controls, the attachment blocks, the attach picker, and the transient
     live "busy" badge. */
  .bus-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn.danger { color: var(--bad); background: var(--input-bg); border: 1px solid rgba(255,107,107,.4); }
  .btn.accent { color: var(--accent); background: var(--input-bg); border: 1px solid var(--accent); }
  .pill.busy { color: var(--warn); border: 1px solid var(--warn); animation: busy-pulse 1.2s ease-in-out infinite; }
  @keyframes busy-pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .pill.busy { animation: none; } }
  .attach { border: 1px solid var(--chip-line); border-radius: 8px; padding: 4px 12px 12px; margin-top: 12px; background: var(--swatch-bg); }
  .attach-picker { border: 1px dashed var(--input-line); border-radius: 8px; padding: 12px; margin-top: 12px; }
  .picker-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
  .btn.attach-ok { color: var(--accent); border: 1px solid var(--accent); background: var(--input-bg); }
  .btn.attach-no { color: var(--dim); border: 1px solid var(--pill-line); background: transparent; text-align: left; }
  .tgmap-row { display: flex; align-items: center; gap: 8px; justify-content: flex-start; }
  .tgmap-row input { flex: 0 0 120px; max-width: 120px; }
  .tgmap-row .arrow { flex: 0 0 auto; color: var(--muted); }
  .tgmap-row .btn { flex: 0 0 auto; }

  /* LAN peering (RFC-0016): peer list, via-peer edges, owner-offline state, and the
     pairing modal (phone-readable, copyable code). */
  .peer-row .peer-fp { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-left: 8px; letter-spacing: .5px; }
  .peer-row.muted .name { color: var(--muted); }
  .peer-disc { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .peer-disc label { color: var(--ink-body); }
  .remote-attach { border-style: dashed; }
  .bus-down { border: 1px solid var(--warn); color: var(--warn); }
  #peer-modal[hidden] { display: none; }
  .pair-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .pair-modal { max-width: 420px; width: 100%; }
  .pair-modal p { color: var(--ink-body); font-size: 13.5px; line-height: 1.5; }
  .pair-code { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  .pair-code .mono { font-family: var(--mono); font-size: 34px; letter-spacing: 8px; color: var(--accent); font-weight: 600; }
  .pair-input { font-family: var(--mono); font-size: 28px; letter-spacing: 8px; text-align: center; width: 100%; padding: 8px; }
  .pair-fp { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  .pair-fp .mono { font-family: var(--mono); color: var(--ink-body); word-break: break-all; }
  .pair-actions { gap: 10px; }
  @media (max-width: 640px) {
    .pair-code .mono { font-size: 30px; letter-spacing: 6px; }
    .peer-disc { flex-wrap: wrap; }
  }

  /* Modes tab (D4): the enable toggles head the panel, then a sub-tab strip over the
     per-mode panels. The strip is a WAI-ARIA tablist — aria-selected carries the
     state, and the dot repeats each mode's enabled bit so the accent colour is never
     the only signal (WCAG 1.4.1). */
  .mode-sec-t { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--card-t); }
  .mode-sec-t.mode-sec-gap { margin-top: 32px; }
  .mode-sec-d { margin: 7px 0 15px; font-size: 12.5px; color: var(--muted); max-width: 560px; line-height: 1.5; }
  .mode-subs { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 18px; padding-bottom: 14px; border-bottom: 1px solid var(--panel-line); }
  .msub { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 1px; color: var(--muted);
    background: var(--chip-bg); border: 1px solid var(--chip-line); }
  .msub:hover { color: var(--ink-body); }
  .msub .msub-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--led-off); }
  .msub.live .msub-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .msub[aria-selected="true"] { color: var(--ink-head); font-weight: 600; background: var(--accent-soft); border-color: var(--accent); }
  .mode-subpanel:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  @media (max-width: 640px) { .msub { min-height: 44px; } }

  /* min(310px, 100%): below ~330px the fixed 310px track is wider than the column,
     which spilled the mode tiles past the viewport edge. */
  .modes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(310px, 100%), 1fr)); gap: 16px; }
  .mode-card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 11px; padding: 18px 20px; }
  .mode-card.on { border-color: rgba(120,140,160,.28); }
  .mode-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .mode-name { font-size: 16px; font-weight: 600; color: var(--ink-head); }
  .mode-desc { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .track { flex: none; width: 46px; height: 26px; border-radius: 13px; padding: 3px; display: flex; background: var(--pill-bg); border: 1px solid var(--pill-line); justify-content: flex-start; }
  .track .knob { width: 18px; height: 18px; border-radius: 50%; background: #6b7688; }
  .mode-card.on .track { background: var(--accent-soft); border-color: var(--accent); justify-content: flex-end; }
  .mode-card.on .track .knob { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  .mode-foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--row-line); }
  .mode-foot .d { width: 7px; height: 7px; border-radius: 50%; background: #333b46; }
  .mode-card.on .mode-foot .d { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .mode-foot .s { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--dim); }
  .mode-card.on .mode-foot .s { color: var(--accent); }

  .netname { flex: 1; background: transparent; border: none; border-bottom: 1px solid transparent; color: var(--card-t); font-family: var(--mono); font-size: 11px; letter-spacing: 2px; padding: 2px 0; }
  .netname:hover { border-bottom-color: var(--field-line); }
  .netname:focus { border-bottom-color: var(--accent); box-shadow: none; }
  .netdel { background: transparent; border: 1px solid var(--pill-line); color: var(--dim); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 13px; flex: none; }
  .netdel:hover { color: var(--bad); border-color: var(--bad); }
  .rewrites { width: 100%; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 9px 11px; color: var(--ink); font-size: 12px; line-height: 1.6; resize: vertical; }
  .row textarea { grid-column: 2; }
  .note { background: var(--panel); border: 1px dashed var(--panel-line); border-radius: 11px; padding: 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .note b { color: var(--ink-body); }

  /* Modem hardware (#18): the disagreements between a node and its modem, and
     the reasons a GPIO hat cannot be heard. Severity is carried by the "Will not
     work" / "Check this" text as well as the colour, so the distinction survives
     for anyone who cannot see the difference between the two hues. */
  .hw-warns { list-style: none; margin: 0; padding: 0; }
  .hw-warn { border-left: 3px solid var(--panel-line); padding: 10px 0 10px 13px; margin-bottom: 11px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .hw-warn:last-child { margin-bottom: 0; }
  .hw-warn.bad { border-left-color: var(--bad); }
  .hw-warn.warn { border-left-color: var(--warn); }
  .hw-warn-k { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; }

  /* Firmware flashing progress (#19). The percentage is written in the label as
     well as drawn as a bar, because a bar alone tells a screen reader nothing
     and tells anyone watching a long write very little either — "verifying,
     62%" is the answer to "is this stuck?". */
  .fw-prog { margin: 12px 0 4px; }
  .fw-prog-lab { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .fw-bar { height: 6px; border-radius: 3px; background: var(--panel-line); overflow: hidden; }
  .fw-bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s linear; }
  .fw-bar.indeterminate > i { width: 40%; animation: fw-sweep 1.1s ease-in-out infinite; }
  @keyframes fw-sweep { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  /* Anyone who has asked not to see motion gets a static half-width bar rather
     than a sweeping one; the stage text above it still says what is happening. */
  @media (prefers-reduced-motion: reduce) {
    .fw-bar.indeterminate > i { animation: none; margin-left: 30%; }
    .fw-bar > i { transition: none; }
  }
  /* The calibration curve (#20). It is a chart rather than a number because the
     SHAPE is the evidence: a clean V is a measurement, a flat line with one dip
     is luck, and an operator who can see which one they got can decide whether
     to believe it. Bars are bit error rate — taller is worse — and a frequency
     nothing was decoded on is drawn as a gap, never as a zero, because 0.00%
     and "never heard anything here" are the same number and opposite meanings. */
  .cal-live { font-family: var(--mono); font-size: 12px; color: var(--fg); }
  .cal-chart { display: flex; align-items: flex-end; gap: 2px; height: 88px; margin: 12px 0 4px; padding: 0 2px; border-bottom: 1px solid var(--panel-line); }
  .cal-bar { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; min-width: 4px; }
  .cal-bar > i { display: block; width: 100%; background: var(--accent); border-radius: 1px 1px 0 0; }
  .cal-bar.best > i { background: var(--ok, var(--accent)); box-shadow: 0 0 0 1px var(--ok, var(--accent)); }
  .cal-bar.partial > i { opacity: .45; }
  /* A silent frequency: a hatch on the baseline, so it reads as "no data" and
     not as "perfect". */
  .cal-bar.silent { border-bottom: 3px solid var(--panel-line); }
  .cal-axis { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .hw-warn.bad .hw-warn-k { color: var(--bad); }
  .hw-warn.warn .hw-warn-k { color: var(--warn); }
  .hw-warn-f { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .mono-sm { font-family: var(--mono); font-size: 11px; }

  /* DMR routing builder */
  .catch-ctl { display: flex; align-items: center; gap: 8px; }
  .route-block { margin-top: 14px; }
  .route-title { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--faint); margin: 4px 0 9px; }
  .route-head, .route-row { display: grid; grid-template-columns: 62px 1fr 16px 1fr 58px 26px; gap: 8px; align-items: center; }
  .route-head { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1px; color: var(--faint); padding: 0 2px 5px; }
  .route-row { margin-bottom: 7px; }
  .route-row .arr { text-align: center; color: var(--dim); font-size: 12px; }
  .mini { background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 9px; color: var(--ink); font-size: 12px; font-family: var(--mono); width: 100%; }
  .route-empty { font-family: var(--mono); font-size: 11px; color: var(--dim); padding: 2px 2px 9px; }
  .mini-btn { margin-top: 4px; padding: 7px 12px; font-size: 11px; }
  .route-warn { margin-top: 11px; font-family: var(--mono); font-size: 11px; color: var(--warn); background: rgba(255,159,69,.08); border: 1px solid rgba(255,159,69,.3); border-radius: 8px; padding: 9px 12px; }
  details.raw-adv { margin-top: 14px; }
  details.raw-adv summary { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--muted); cursor: pointer; padding: 4px 0; list-style: none; }
  details.raw-adv summary::before { content: "▸ "; color: var(--dim); }
  details.raw-adv[open] summary::before { content: "▾ "; }
  details.raw-adv textarea { margin-top: 9px; }
  /* LCD page builder */
  .lcd-page { padding: 6px 20px 16px; }
  .lcd-pagehead { gap: 10px; flex-wrap: wrap; }
  .lcd-pagename { flex: 1; min-width: 130px; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 7px 10px; color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .lcd-dur { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .lcd-dur input { width: 52px; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 6px 8px; color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .lcd-line { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; padding: 5px 0; }
  .lcd-linelabel { font-family: var(--mono); font-size: 11px; color: var(--label); }
  .lcd-lineinput { width: 100%; background: var(--field); border: 1px solid var(--field-line); border-radius: 6px; padding: 8px 10px; color: var(--ink); font-family: var(--mono); font-size: 12px; }
  .lcd-tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .lcd-tok { font-family: var(--mono); font-size: 10.5px; color: var(--muted); background: var(--chip-bg); border: 1px solid var(--field-line); border-radius: 5px; padding: 4px 7px; cursor: pointer; }
  .lcd-tok:hover { color: var(--accent); border-color: var(--accent); }
  .lcd-warn { margin-top: 11px; font-family: var(--mono); font-size: 11px; color: var(--warn); background: rgba(255,159,69,.08); border: 1px solid rgba(255,159,69,.3); border-radius: 8px; padding: 8px 11px; }
  /* page reorder + interrupt controls in the page head */
  .lcd-move { font-family: var(--mono); font-size: 12px; line-height: 1; color: var(--muted); background: var(--chip-bg); border: 1px solid var(--field-line); border-radius: 5px; padding: 5px 8px; cursor: pointer; }
  .lcd-move:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .lcd-move:disabled { opacity: .35; cursor: default; }
  /* live client-side preview, a monospace facsimile of the panel */
  .lcd-preview { margin-top: 12px; }
  .lcd-preview-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
  .lcd-screen { display: inline-block; font-family: var(--mono); font-size: 13px; line-height: 1.5; white-space: pre; color: #7dff9b; background: #071a0d; border: 1px solid #123; border-radius: 6px; padding: 8px 10px; letter-spacing: 1px; }
  /* token reference legend */
  .lcd-legend { margin-top: 4px; }
  .lcd-legend summary { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--muted); cursor: pointer; padding: 4px 0; }
  .lcd-legend dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0 0; }
  .lcd-legend dt { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .lcd-legend dd { margin: 0; font-size: 11.5px; color: var(--dim); }
  .note code { font-family: var(--mono); font-size: 11px; color: var(--accent); background: rgba(255,255,255,.04); padding: 1px 4px; border-radius: 3px; }
  /* pill toggles rendered as real buttons (keyboard-operable) */
  button.pill { background: transparent; cursor: pointer; }
  /* mode tiles are real buttons — reset the UA chrome so they look like cards */
  button.mode-card { width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  /* visible focus for every interactive control, keyboard-only */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
  .pill:focus-visible, .mode-card:focus-visible, .nav-item:focus-visible, .swatch:focus-visible,
  .lcd-tok:focus-visible, .netdel:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* Skip link — hidden until focused, then pinned top-left over everything. */
  .skip-link { position: fixed; left: 8px; top: -60px; z-index: 100; background: var(--panel); color: var(--ink-head);
    border: 1px solid var(--accent); border-radius: 7px; padding: 9px 14px; font-family: var(--mono); font-size: 12px;
    transition: top .15s ease; }
  .skip-link:focus { top: 8px; text-decoration: none; outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Visually-hidden but read by screen readers. */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .hide { display: none; }
</style>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="chrome.skipToSettings">Skip to settings</a>
<div class="app" id="app">
  <aside>
    <div class="brand">
      <a class="brand-row" href="/" style="text-decoration:none;" title="Back to dashboard" data-i18n-attr="title:chrome.backToDashboard">
        <svg width="27" height="27" viewBox="0 0 512 512" style="flex:none;" fill="var(--accent)" aria-hidden="true"><path d="M256 474 C201 410 138 362 138 284 A118 118 0 0 1 374 284 C374 362 311 410 256 474 Z"></path><path d="M247 302 L265 302 L259 128 L253 128 Z"></path><circle cx="256" cy="110" r="16"></circle><g fill="none" stroke="var(--accent)" stroke-width="13" stroke-linecap="round"><path d="M216 80 Q188 110 216 140"></path><path d="M196 60 Q156 110 196 160"></path><path d="M296 80 Q324 110 296 140"></path><path d="M316 60 Q356 110 316 160"></path></g><circle cx="256" cy="288" r="46" fill="#0b0d12"></circle></svg>
        <div>
          <div class="brand-name">WAYPOINT</div>
          <div class="brand-sub" data-i18n="sidebar.tagline">HOTSPOT CONTROL</div>
        </div>
      </a>
      <div class="callsign-chip">
        <div>
          <div class="chip-k" data-i18n="sidebar.callsign">CALLSIGN</div>
          <div class="chip-v" id="side-callsign">—</div>
        </div>
        <div class="online"><span class="led"></span><span class="txt" data-i18n="sidebar.online">ONLINE</span></div>
      </div>
    </div>
    <nav id="nav" aria-label="Configuration sections" data-i18n-attr="aria-label:nav.configSections">
      <div class="nav-head" data-i18n="nav.configuration">CONFIGURATION</div>
    </nav>
    <div class="theme-pick">
      <div class="theme-head" id="theme-head" data-i18n="chrome.theme">DISPLAY THEME</div>
      <div class="swatches" id="swatches" role="group" aria-labelledby="theme-head"></div>
      <!-- Filled by i18n.js via settings.js; hidden while only one catalog ships. -->
      <div class="lang-pick" id="lang-pick" hidden></div>
    </div>
  </aside>

  <main id="main">
    <div class="statusbar">
      <div class="stat"><span class="k" data-i18n="status.dashboard">DASHBOARD</span><span class="v" id="st-version">—</span></div>
      <div class="stat"><span class="k" data-i18n="status.mode">MODE</span><span class="v accent" id="st-mode">—</span></div>
      <div class="stat"><span class="k" data-i18n="status.uptime">UPTIME</span><span class="v" id="st-uptime">—</span></div>
