version: "2"

# The repository carries a pre-existing lint baseline: 63 findings across packages
# that predate the first-boot setup workstream (50 errcheck, 10 staticcheck, 3
# unused, as of the merge-base below). Fixing them is worth doing and is not this
# workstream's job — a sweep through a dozen unrelated packages inside a feature
# branch is a review nobody can do properly.
#
# So the gate is differential: findings in code this branch touched fail CI,
# findings in code it did not are reported and do not. New code stays at zero
# without the baseline blocking anything.
issues:
  # Everything since the workstream's base commit is held to the full standard.
  # Set WAYPOINT_LINT_BASE in CI to compare against a different point; locally,
  # `golangci-lint run --new-from-rev=origin/main` is the same check.
  new-from-rev: origin/main

  # The defaults hide repeated instances of the same finding, which turns "this
  # file has twelve unchecked errors" into "this file has three". For a gate that
  # is meant to keep new code at zero, every instance should show.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard

  exclusions:
    rules:
      # Deferred Close on a read-only handle. The error is unactionable — there is
      # nothing to flush and the read has already happened — and the alternative
      # is a closure wrapper on every one, which reads worse than the thing it
      # replaces. Writes are NOT excluded: a failed Close on a written file can
      # mean lost data, and those are checked explicitly throughout.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\(\)$'
        path: _test\.go

formatters:
  enable:
    - gofmt
