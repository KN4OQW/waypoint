name: Feature request
description: Something Waypoint should do
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The real-world situation, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: markdown
    attributes:
      value: Architecture-scale ideas belong here too — the RFC process is dormant until v1 (see GOVERNANCE.md), so an issue is the right place to start whatever the scale.
