name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm, arm64]
        include:
          - goarch: arm
            goarm: "6" # Pi Zero W stays supported — this is policy, not nostalgia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build (${{ matrix.goarch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_SHA::8}" ./cmd/waypointd ./cmd/waypoint-provision-helper

  # The lint gate is differential: the repository carries a pre-existing baseline
  # in packages this workstream did not touch, and fixing those inside a feature
  # branch would be a review nobody can do properly. New code is held to zero.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # new-from-rev needs the history to diff against
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2
          args: --new-from-rev=origin/main

  # ui/static/locales/index.json is generated from the catalogs' _meta blocks
  # (tools/genlocaleindex). That is what makes adding a language a new .json file
  # and nothing else — issue #23's acceptance criterion. A hand-edited or stale
  # index quietly breaks it, so regenerate and refuse any diff.
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go generate
        run: go generate ./...
      - name: Refuse a stale generated file
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'go generate ./...' and commit the result."
            exit 1
          fi

  # Advisory only (issue #23): flags user-visible English added to the frontend
  # without a catalog key. A heuristic on added lines, deliberately not a gate —
  # see the script header for what it cannot see.
  i18n-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn on hardcoded UI strings
        run: ./tools/ci/hardcoded-strings.sh origin/${{ github.base_ref || 'main' }}

  # Every unit the image ships is parsed by systemd itself. A directive that
  # systemd silently ignores — a misspelled hardening option, a stale unit name in
  # an After= — is invisible until the node it was meant to protect is in the
  # field.
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify
        run: ./image/tests/verify-units.sh

  # The provisioning helper creates accounts and locks root, so its integration
  # test runs against a real Debian filesystem in a throwaway container rather
  # than against the runner. It is a separate job because it needs Docker and
  # takes longer than the unit suite.
  provision-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Integration (sysprov, in a container)
        run: ./internal/sysprov/testdata/integration/run.sh -test.v
