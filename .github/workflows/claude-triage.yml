name: Claude (auto triage & review)

# Every new issue gets a first technical read; every PR gets a review pass.
# Per GOVERNANCE.md this supplements — never replaces — the 14-day human SLA.

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Quota protection: auto-runs are limited to trusted authors (owner/member/
# collaborator). Anything else waits for a maintainer to @claude it manually
# — the interactive workflow is write-access-gated by the action itself.
jobs:
  triage-issue:
    if: >-
      github.event_name == 'issues' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Triage issue #${{ github.event.issue.number }} in this repository.
            1. Read the issue. If it's a bug report, check whether it contains enough to reproduce (versions, board, logs); if not, ask specifically for what's missing.
            2. Search existing issues for duplicates; link any you find.
            3. Apply the most fitting area:* and priority label if clearly warranted (use `gh issue edit`); otherwise leave labeling to maintainers.
            4. Post one concise, friendly comment with your read. Newcomers get extra warmth — elmering is the culture here.
            You advise; maintainers decide. Never close issues.
          claude_args: --allowedTools "Bash(gh issue:*),Bash(gh search:*),Read,Grep,Glob"

  review-pr:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }}: correctness first, then test coverage (config-losslessness regressions are release-blockers), then privacy, then accessibility for UI changes (no color-only status), then style drift. Post findings as a single review comment, most severe first, each anchored to file:line. Acknowledge what the PR does well. Read CLAUDE.md in the repository root first — it carries the project's testing and evidence standards, and this review applies them.
            On tests, the bar is not "the suite passes": ask what this PR asserts that nothing asserted before, and flag a behavior change that ships without a test for it. If the PR adds a rule reporting some configuration as wrong, check that it cites its evidence (upstream source line or protocol field width) and is tested against passing cases as well as failing ones — an ungrounded rule tells operators their working node is broken. If it changes a renderer, ask whether test/tier2 still covers the real daemon accepting the result.
            Do NOT ask for an RFC. The RFC process is dormant until v1 (GOVERNANCE.md#rfcs); architecture-scale changes go through issues and PRs like everything else.
            Privacy is a merge gate (GOVERNANCE.md principle 2, issue #15): a Waypoint device contacts project infrastructure only to check for updates and refresh public host/ID databases, both user-disableable, and no build of Waypoint has telemetry. Flag as a blocker any new outbound request (http client, fetch, exec of a network tool, new URL constant); any device identifier — callsign, DMR/CCS7 ID, hostname, MAC, serial, per-device token, cookie, version or config detail — added to an existing request's URL, headers, or body; any unattended/periodic fetch not gated on the operator's check_enabled preference; and any check-time gate that also disables something unrelated. Say plainly when a PR adds none of these.
            You advise; maintainers merge.
          claude_args: --allowedTools "Bash(gh pr:*),Read,Grep,Glob"
