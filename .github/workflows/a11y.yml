name: a11y

# Accessibility is a merge gate (issue #7): axe-core against the live dashboard
# and every settings/wizard tab, in all three themes and both display modes,
# failing on any WCAG 2.1 A/AA violation.
#
# The automatic triggers were off from #121 until this commit. The job had been
# failing on main for reasons that were not about accessibility at all — the
# daemon could not create its default TLS directory on a runner and exited, and it
# serves HTTPS while this job probes http:// — so it had never actually scanned
# anything. Fixing that exposed a real backlog, and blocking every unrelated PR on
# it would have helped nobody.
#
# That backlog is now cleared: 270 pages across three themes and both modes, zero
# violations. The gate is back on. Note that the headline count roughly doubled
# when the harness was fixed, because it had been scanning one palette while
# reporting three — see the comments in ui/a11y/scan.mjs before reading any
# historical figure in #121 as comparable to a current one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build waypointd
        run: go build -o waypointd ./cmd/waypointd

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install a11y harness
        working-directory: ui/a11y
        run: npm ci

      - name: Install Chromium
        working-directory: ui/a11y
        run: npx playwright install --with-deps chromium

      - name: Start demo daemon
        run: |
          # -tls-dir: the default is /var/lib/waypoint/tls, which a runner
          # cannot create, and the daemon exits when it cannot mint its cert.
          # -tls=false: the daemon serves HTTPS by default, and this job probes
          # http://127.0.0.1:8073, so the handshake would never complete.
          # -dmr-ids: both callsign type-aheads are scanned with rows in the
          # dropdown, and the real table behind them is a 6.4 MB runtime
          # download. The fixture makes that state exist deterministically
          # instead of depending on whether a download succeeded on a runner.
          ./waypointd -demo -addr 127.0.0.1:8073 -store "$RUNNER_TEMP/a11y.db" \
            -tls=false -tls-dir "$RUNNER_TEMP/tls" \
            -dmr-ids "$GITHUB_WORKSPACE/ui/a11y/DMRIds.fixture.dat" \
            > "$RUNNER_TEMP/waypointd.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wp.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8073/api/health > /dev/null; then
              echo "daemon up"; exit 0
            fi
            sleep 1
          done
          echo "daemon did not come up"; cat "$RUNNER_TEMP/waypointd.log"; exit 1

      - name: Run axe-core accessibility scan
        working-directory: ui/a11y
        env:
          BASE: http://127.0.0.1:8073
        run: npm run scan

      - name: Show daemon log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/waypointd.log" || true

      - name: Stop demo daemon
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/wp.pid")" 2>/dev/null || true
