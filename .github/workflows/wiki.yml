name: wiki

# The operator-facing pages on the GitHub wiki are PUBLISHED FROM THIS REPO, not
# edited in the browser. Recovery instructions that drift from the software they
# describe are worse than none — someone locked out of a node follows them
# exactly and blames themselves when the command has changed — and a wiki nobody
# can review is where that drift happens.
#
# So the files under docs/ are the single source, versioned and reviewed with the
# code they describe, and this job mirrors them onto the wiki whenever they
# change. Edits made in the wiki UI are overwritten on the next push; each page
# says so.
#
# ONE MANUAL STEP IS REQUIRED FIRST. GitHub does not create a repository's wiki
# until a page has been saved through the web UI at least once, and there is no
# API for it — so until somebody creates any page (content irrelevant), this job
# has nothing to push to and will say so rather than fail silently.

on:
  push:
    branches: [main]
    paths:
      - docs/recovery.md
      - docs/translations.md
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish docs/ to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki 2>/dev/null; then
            echo "::warning::This repository's wiki has never been initialised, so there is nothing to push to."
            echo "::warning::Create any page once at https://github.com/${GITHUB_REPOSITORY}/wiki/_new — this job will publish over it from then on."
            exit 0
          fi

          # source-file:wiki-page-name. The page name is its filename, so
          # "Regaining-access" renders as "Regaining access" and gives a URL
          # somebody can be told over the air.
          PAGES="docs/recovery.md:Regaining-access docs/translations.md:Translating-Waypoint"

          for entry in $PAGES; do
            src="${entry%%:*}"
            page="${entry##*:}"
            {
              echo "> **This page is generated from [\`${src}\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/${src}) in the Waypoint repository.**"
              echo "> Edits made here are overwritten the next time that file changes — send a pull request instead."
              echo
              cat "$src"
            } > "wiki/${page}.md"
          done

          cd wiki
          git config user.name  "waypoint-docs[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Wiki already matches docs/; nothing to publish."
            exit 0
          fi
          git add -A
          git commit -q -m "Publish docs/ to the wiki (${GITHUB_SHA:0:7})"
          git push -q origin HEAD
          for entry in $PAGES; do
            echo "Published https://github.com/${GITHUB_REPOSITORY}/wiki/${entry##*:}"
          done
